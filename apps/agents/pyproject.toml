[project]
name = "agents"
version = "0.1.0"
description = "CrewAI pre-standup briefings: leads for sales/PM, design and dev news"
requires-python = ">=3.12,<3.14"
dependencies = [
  "crewai>=0.100",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "feedparser>=6.0",
  "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
