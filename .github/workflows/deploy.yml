name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/team-assistant

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ vars.DEPLOY_PATH || '~/team-assistant' }}

      - name: Pull images and recreate containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/team-assistant' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_PREFIX,IMAGE_TAG,DEPLOY_PATH
          script_stop: true
          script: |
            set -eu
            cd "${DEPLOY_PATH/#\~/$HOME}"
            export IMAGE_PREFIX IMAGE_TAG
            compose="docker compose -f docker-compose.prod.yml"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            $compose pull api worker web
            $compose up -d --wait postgres redis
            # Migrate with the API stopped so it never runs against a half-migrated schema.
            $compose stop api worker 2>/dev/null || true
            for i in $(seq 1 30); do
              $compose exec -T postgres pg_isready -U "${POSTGRES_USER:-teamassistant}" >/dev/null 2>&1 && break
              echo "waiting for postgres... ($i)"; sleep 2
            done
            $compose run --rm --no-deps -w /app/packages/database api bunx drizzle-kit migrate
            $compose run --rm --no-deps -w /app/packages/database api bun run src/seed.ts
            $compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
