# Production stack for the VPS. Images are built by .github/workflows/deploy.yml
# and pulled from GHCR; secrets come from .env next to this file.
x-app: &app
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamassistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-teamassistant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamassistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *app
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}-api:${IMAGE_TAG:-latest}
    environment: &app-env
      DATABASE_URL: postgres://${POSTGRES_USER:-teamassistant}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-teamassistant}
      REDIS_URL: redis://redis:6379
      INTERNAL_API_URL: http://api:4000
      AGENTS_URL: http://agents:8100
      HERMES_BRIDGE_URL: http://hermes:8700
      HERMES_API_URL: http://hermes:8642
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      PORT: 4000
      NODE_ENV: production
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - whatsapp-data:/app/apps/api/data
    # "agents": Hermes (bridge + chat); "ops": the Docker proxy for the ops agent's whitelisted actions.
    networks: [default, agents, ops]

  worker:
    <<: *app
    image: ${IMAGE_PREFIX}-worker:${IMAGE_TAG:-latest}
    environment: *app-env

  # CrewAI briefings; only the API calls it, so no published port.
  agents:
    image: ${IMAGE_PREFIX}-agents:${IMAGE_TAG:-latest}
    env_file: .env
    restart: unless-stopped
    environment:
      NODE_ENV: production

  web:
    image: ${IMAGE_PREFIX}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

  # Naya (naya.digdaya.co): the AI team's office, on the same API as the dashboard.
  naya:
    image: ${IMAGE_PREFIX}-naya:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${NAYA_PORT:-3001}:80"
    depends_on:
      - api

  # Hermes Agent + hermes-bridge. Only on the "agents" network: no route to Postgres, Redis or
  # the Docker socket, and no daily .env. Its own config and model keys live in hermes-data
  # (set up once with `docker compose exec hermes hermes setup`; see docs/naya.md).
  hermes:
    image: ${IMAGE_PREFIX}-hermes:${IMAGE_TAG:-latest}
    # Kanban claims carry the host name, and Hermes only re-queues a task whose worker died when
    # the claim is from its own host. Docker gives every new container a new random host name, so
    # without a fixed one each deploy left the tasks that were running stuck in "running" forever.
    hostname: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?set BRIDGE_TOKEN in .env}
      # Reachable from the api container; each profile's API_SERVER_KEY lives in hermes-data.
      API_SERVER_HOST: 0.0.0.0
      # OpenCode runs on the host; Naya reads its session database (metadata only) from here.
      OPENCODE_DATA_DIR: /opt/opencode
    volumes:
      - hermes-data:/opt/data
      # The host's OpenCode data folder (OPENCODE_HOST_DATA, e.g. /root/.local/share/opencode),
      # read-only. Unset: an empty folder, and OpenCode has no desk in the office.
      - ${OPENCODE_HOST_DATA:-./opencode-data}:/opt/opencode:ro
    networks: [agents]
    # One multiplexed gateway (~250 MB) serves every profile; each running Kanban task adds a
    # worker. The image has no Chromium, so the browser tool stays off and needs no headroom.
    # Set here, not on the server: every deploy copies this file over the server's copy.
    mem_limit: 1536m
    cpus: 1.5

  # Read-only Docker API for the ops agent's actions (status, logs, restart of whitelisted
  # services), reachable only from the api container over the internal "ops" network.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:lts@sha256:be1ac64f33bd82043beb504822a17ba6b71668ea1ad7cf51a9a01d27bb7ab047
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      ALLOW_RESTARTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [ops]

networks:
  default:
  agents:
  ops:
    internal: true

volumes:
  pgdata:
  redisdata:
  whatsapp-data:
  hermes-data:
