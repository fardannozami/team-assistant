# Production stack for the VPS. Images are built by .github/workflows/deploy.yml
# and pulled from GHCR; secrets come from .env next to this file.
x-app: &app
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamassistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-teamassistant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamassistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *app
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}-api:${IMAGE_TAG:-latest}
    environment: &app-env
      DATABASE_URL: postgres://${POSTGRES_USER:-teamassistant}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-teamassistant}
      REDIS_URL: redis://redis:6379
      INTERNAL_API_URL: http://api:4000
      PORT: 4000
      NODE_ENV: production
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - whatsapp-data:/app/apps/api/data

  worker:
    <<: *app
    image: ${IMAGE_PREFIX}-worker:${IMAGE_TAG:-latest}
    environment: *app-env

  web:
    image: ${IMAGE_PREFIX}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  whatsapp-data:
