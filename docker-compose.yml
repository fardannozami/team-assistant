services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamassistant
      POSTGRES_PASSWORD: teamassistant
      POSTGRES_DB: teamassistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamassistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://teamassistant:teamassistant@postgres:5432/teamassistant
      REDIS_URL: redis://redis:6379
      PORT: 4000
      AGENTS_URL: http://agents:8100
      HERMES_BRIDGE_URL: http://hermes:8700
      HERMES_API_URL: http://hermes:8642
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
      BRIDGE_TOKEN: dev-bridge-token-change-me
    ports:
      - "4000:4000"
    volumes:
      - whatsapp-data:/app/apps/api/data
    networks: [default, agents, ops]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgres://teamassistant:teamassistant@postgres:5432/teamassistant
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agents:
    build:
      context: .
      dockerfile: docker/agents.Dockerfile
    ports:
      - "8100:8100"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  # The AI team (Naya + Hermes) only starts with: docker compose --profile agents up
  naya:
    profiles: [agents]
    build:
      context: .
      dockerfile: docker/naya.Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - api

  hermes:
    profiles: [agents]
    build:
      context: .
      dockerfile: docker/hermes.Dockerfile
    command: ["gateway", "run"]
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      BRIDGE_TOKEN: dev-bridge-token-change-me
      API_SERVER_HOST: 0.0.0.0
    ports:
      # Bridge and API server on localhost, for `bun run dev` of the api outside Docker.
      - "127.0.0.1:8700:8700"
      - "127.0.0.1:8642:8642"
    volumes:
      - hermes-data:/opt/data
    networks: [agents]

  docker-socket-proxy:
    profiles: [agents]
    image: tecnativa/docker-socket-proxy:lts@sha256:be1ac64f33bd82043beb504822a17ba6b71668ea1ad7cf51a9a01d27bb7ab047
    environment:
      CONTAINERS: 1
      ALLOW_RESTARTS: 1
      POST: 0
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [ops]

networks:
  default:
  agents:
  ops:

volumes:
  pgdata:
  redisdata:
  whatsapp-data:
  hermes-data:
